name: iOS IPA (unsigned)

# 在 macOS runner 上产出**未签名** .ipa，交给 Windows 侧 Sideloadly / AltStore
# 用 Apple ID 重签安装（不需要 Xcode，也不需要证书）。
#
# 触发：Actions 页面手动运行（可关掉本地 VLM 引擎），或改动 impl/ios、impl/shard 时。
# 成本提示：私有仓库的 macOS runner 按 10 倍分钟计费；本地 VLM 引擎首次构建约 10–20 分钟，
#          之后命中缓存。

on:
  workflow_dispatch:
    inputs:
      with_llama:
        description: "构建本地 VLM 引擎（llama.cpp）。关闭则产物只能走「远程服务」模式"
        type: boolean
        default: true
  push:
    branches: [main, master]
    paths:
      - "impl/ios/**"
      - "impl/shard/**"
      - ".github/workflows/ios-ipa.yml"

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      LLAMA_REF: master
      # 想强制重建 llama.xcframework（例如上游 mtmd API 变了），把这个 key 改一下
      # v2：求值改用 mtmd_helper_eval_chunks（M-RoPE），依赖 mtmd-helper.h 与 mtmd_input_chunk_get_n_pos
      LLAMA_CACHE_KEY: llama-master-v2
      # ONNX Runtime 包形态/来源变化时同样改这个 key
      ORT_CACHE_KEY: ort-1.22.0-v1

    steps:
      - uses: actions/checkout@v4

      - name: 工具与版本
        run: |
          xcodebuild -version
          cmake --version | head -1
          brew install xcodegen
          xcodegen --version

      - name: 缓存 llama.cpp 源码
        if: ${{ inputs.with_llama != false }}
        uses: actions/cache@v4
        with:
          path: impl/ios/.build/llama.cpp
          key: ${{ env.LLAMA_CACHE_KEY }}-src

      - name: 缓存 llama.xcframework
        id: llama-framework
        if: ${{ inputs.with_llama != false }}
        uses: actions/cache@v4
        with:
          path: impl/ios/Frameworks/llama.xcframework
          key: ${{ env.LLAMA_CACHE_KEY }}-xcframework-${{ runner.arch }}

      - name: 缓存 onnxruntime.xcframework
        id: ort-framework
        uses: actions/cache@v4
        with:
          path: impl/ios/Frameworks/onnxruntime.xcframework
          key: ${{ env.ORT_CACHE_KEY }}

      - name: 版面引擎（ONNX Runtime）
        if: steps.ort-framework.outputs.cache-hit != 'true'
        run: bash impl/ios/scripts/fetch-onnxruntime.sh

      - name: 本地 VLM 引擎（llama.cpp + libmtmd）
        if: ${{ inputs.with_llama != false && steps.llama-framework.outputs.cache-hit != 'true' }}
        env:
          LLAMA_PLATFORMS: ios-device
        run: bash impl/ios/scripts/build-llama-xcframework.sh

      # bootstrap 负责：缺 llama 时生成不带该依赖的 spec、以及 xcodegen 生成工程
      - name: 生成 Xcode 工程
        run: bash impl/ios/scripts/bootstrap.sh

      - name: 打包未签名 ipa
        run: bash impl/ios/scripts/package-ipa.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: VLOCR-unsigned-ipa
          path: impl/ios/build/VLOCR-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      # 本地没有 Mac 时，编译日志只能在 CI 里看：失败时一并上传，便于逐条修
      # （只传日志，不上传 xcarchive：含全部符号与框架，几百 MB，下载很慢）
      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: impl/ios/build/xcodebuild.log
          retention-days: 7
          if-no-files-found: warn
