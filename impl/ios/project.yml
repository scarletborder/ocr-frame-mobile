# XcodeGen 工程定义（impl/ios）。生成命令：xcodegen generate
#
# 两个 xcframework 不入库，由 scripts/bootstrap.sh 准备到 Frameworks/：
#   Frameworks/onnxruntime.xcframework  —— PP-DocLayoutV3 版面分析（ONNX Runtime C API，静态）
#   Frameworks/llama.xcframework        —— PaddleOCR-VL 视觉语言模型（llama.cpp + libmtmd，动态）
# 缺任一框架时 Bridge/*.mm 通过 __has_include 退化为「引擎不可用」，工程仍可编译。
name: VLOCR

options:
  bundleIdPrefix: ai.ocrframe
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_ENABLE_OBJC_ARC: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  VLOCR:
    type: application
    platform: iOS
    sources:
      - path: VLOCR
        excludes:
          - "Resources/Info.plist"
      # 共享核心（与 impl/android 同一份源码）。引擎是否编译由 __has_include 自动探测：
      # 两个 xcframework 存在时才走真实推理，否则退化为「引擎不可用」。
      - path: ../shard/src
      - path: ../shard/include
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.ocrframe.vlocr
        PRODUCT_NAME: VLOCR
        INFOPLIST_FILE: VLOCR/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: VLOCR/Bridge/VLOCRBridging.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../shard/include
          # onnxruntime 有两种打包形态：library 型 xcframework 的头在切片 Headers/ 下，
          # framework 型的头由 <onnxruntime/…> 直接解析。两条都加上，缺的路径无害。
          - $(PROJECT_DIR)/Frameworks/onnxruntime.xcframework/ios-arm64/Headers
          - $(PROJECT_DIR)/Frameworks/onnxruntime.xcframework/ios-arm64-simulator/Headers
          - $(PROJECT_DIR)/Frameworks/onnxruntime.xcframework/ios-arm64/onnxruntime.framework/Headers
          - $(PROJECT_DIR)/Frameworks/onnxruntime.xcframework/ios-arm64-simulator/onnxruntime.framework/Headers
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/Frameworks
        OTHER_LDFLAGS:
          - $(inherited)
          - -lc++
        # 0.9B 权重 + 800x800 版面模型在真机上需要较大内存预算
        CODE_SIGN_STYLE: Automatic
        # 两条部署路线：
        #   · Windows + Sideloadly（主路线）：产物是未签名 ipa，脚本用 CODE_SIGNING_ALLOWED=NO，
        #     这里**不用**填 Team。
        #   · Mac + Xcode 直装：填你的 Team ID（`security find-identity -v -p codesigning` 可见），
        #     否则每次 xcodegen 重新生成工程都会丢掉在 Xcode UI 里选的 Team。
        DEVELOPMENT_TEAM: ""
    dependencies:
      # 官方 pod-archive 是静态 framework，GitHub 上的 1.22.0 镜像是动态 dylib 型 xcframework。
      # 统一 embed：动态包必须嵌入才能启动；静态包被嵌入只是多占体积（sideload 场景无副作用）。
      - framework: Frameworks/onnxruntime.xcframework
        embed: true
        codeSign: true
      - framework: Frameworks/llama.xcframework
        embed: true
        codeSign: true

# 显式声明 scheme：CI 与 scripts/package-ipa.sh 都依赖 `-scheme VLOCR`
schemes:
  VLOCR:
    build:
      targets:
        VLOCR: all
    run:
      config: Debug
    archive:
      config: Release
